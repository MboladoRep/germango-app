<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germango Pro 9.4</title>
<link rel="stylesheet" href="css/styles.css?v=9.4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="logo" onclick="showScreen('screen-map')"><span>🦉</span> GERMANGO</div>
  <div class="stats">
    <div class="stat-box buyable" onclick="openShop()"><span>❤️</span><span id="s-hearts">5</span></div>
    <div class="stat-box"><span>💎</span><span id="s-gems">500</span></div>
    <div class="stat-box"><span>🔥</span><span id="s-streak">0</span></div>
  </div>
</header>

<main id="app">
  <div id="screen-map" class="screen active"><div class="map-wrapper" id="map-container"><div class="loader"></div></div></div>

  <div id="screen-lesson" class="screen">
    <div class="progress-bar" id="progress-bar"></div>
    <div class="lesson-content" id="lesson-content"></div>
    <div class="footer-bar">
      <div class="feedback-msg" id="feedback-msg"><span id="msg-text"></span><span id="msg-sub" style="font-size:0.8rem; margin-top:4px; opacity:0.8"></span></div>
      <button class="btn-main" id="btn-action" onclick="handleAction()">COMPROBAR</button>
    </div>
  </div>

  <div id="screen-result" class="screen" style="justify-content: center; text-align: center;">
    <div class="overlay-icon">🎉</div>
    <h1 style="font-size: 1.8rem; margin-bottom: 10px;">¡Lección completada!</h1>
    <p style="color: var(--text-dim); margin-bottom: 20px;">+20 XP 💎</p>
    <button class="btn-main active" onclick="exitToMap()">CONTINUAR</button>
  </div>

  <div id="overlay-gameover" class="overlay">
    <div class="overlay-icon">💔</div>
    <h2 style="margin-bottom:10px; font-size:1.5rem">Lección fallida</h2>
    <p style="color: var(--text-dim); margin-bottom: 20px; font-size:0.9rem">Te has quedado sin vidas.</p>
    <button class="btn-main active" onclick="buyLivesRetry()">Comprar Vidas (50💎)</button>
    <button class="btn-main" style="margin-top:10px; background:#333; border-bottom-color:#222; color:#aaa; pointer-events:all;" onclick="exitToMap()">VOLVER</button>
  </div>

  <div id="overlay-shop" class="overlay">
    <h2 style="margin-bottom:10px">Tienda</h2>
    <div style="background:var(--card-dark); padding:20px; border-radius:15px; margin-top:20px; cursor:pointer;" onclick="shopPurchase('hearts')">
      <div style="font-size: 2rem;">❤️</div>
      <div style="font-weight:700; margin-top:10px;">Recargar Vidas</div>
      <div style="color: var(--bonus-gold); margin-top:5px;">50 💎</div>
    </div>
    <button class="btn-main" style="margin-top:30px; background:#333; border-bottom-color:#222; color:#aaa; pointer-events:all;" onclick="closeShop()">Cerrar</button>
  </div>
</main>

<!-- Orden de carga importante (ver CLAUDE.md). Scripts clásicos: las funciones son globales por los onclick. -->
<script src="js/config.js?v=9.4"></script>
<script src="js/data/vocab.js?v=9.4"></script>
<script src="js/data/course.js?v=9.4"></script>
<script src="js/state.js?v=9.4"></script>
<script src="js/audio.js?v=9.4"></script>
<script src="js/questions.js?v=9.4"></script>
<script src="js/ui.js?v=9.4"></script>
<script src="js/speech.js?v=9.4"></script>
<script src="js/lesson.js?v=9.4"></script>
<script src="js/main.js?v=9.4"></script>
</body>
</html>
