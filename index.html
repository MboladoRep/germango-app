* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
/* Header */
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 2px solid var(--border-color); background: var(--bg-dark); z-index: 100; flex-shrink: 0; }
.logo { font-weight: 800; font-size: 1.2rem; color: var(--primary-green); cursor: pointer; display: flex; align-items: center; gap: 5px; }
.stats { display: flex; gap: 10px; }
.stat-box { display: flex; align-items: center; gap: 4px; font-weight: 700; background: var(--card-dark); padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: transform 0.1s; }

.stat-box.buyable { border: 1px solid var(--bonus-gold); }
/* Main Layout */
main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 700px; margin: 0 auto; padding: 20px; }
.screen { display: none; width: 100%; height: 100%; flex-direction: column; animation: fadeIn 0.3s; }
.screen.active { display: flex; }

/* Map Screen */
.map-wrapper { position: relative; width: 100%; padding: 20px 0 50px; display: flex; flex-direction: column; align-items: center; }
.unit-container { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 30px; }
.unit-header { width: 100%; padding: 12px; margin-bottom: 15px; background: linear-gradient(90deg, rgba(88,204,2,0.1) 0%, transparent 100%); border-left: 5px solid var(--primary-green); border-radius: 0 10px 10px 0; }
.unit-title { font-weight: 800; font-size: 1rem; color: var(--primary-green); }

.lessons-row { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; }
.lesson-node { width: 70px; height: 70px; border-radius: 50%; background: var(--card-dark); border: 3px solid var(--text-dim); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; position: relative; z-index: 2; gap: 2px; margin: 5px 0; }
.lesson-node::before { content: ''; position: absolute; bottom: 100%; width: 3px; height: 20px; background: var(--border-color); z-index: 1; }
.lesson-node.first-node::before { display: none; }
.lesson-node.completed::before { background: var(--primary-green); }
.lesson-node:hover:not(.locked) { transform: scale(1.1); border-color: var(--secondary-blue); }
.lesson-node.completed { border-color: var(--primary-green); color: var(--primary-green); background: rgba(88, 204, 2, 0.1); }
.lesson-node.locked { opacity: 0.4; cursor: not-allowed; }
.lesson-node.current { border-color: var(--secondary-blue); box-shadow: 0 0 15px rgba(28, 176, 246, 0.4); animation: bounce 2s infinite; }
.lesson-node .icon { font-size: 1.5rem; }
.lesson-node .lvl { font-size: 0.6rem; opacity: 0.7; }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-8px);} 60% {transform: translateY(-4px);} }
/* Global Progress */
.global-progress-container { width: 100%; margin-bottom: 30px; background: var(--card-dark); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
.gp-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-dim); }
.gp-bar { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
.gp-fill { height: 100%; background: linear-gradient(90deg, var(--primary-green), var(--bonus-gold)); width: 0%; transition: width 0.5s; }
/* Lesson Screen */
.progress-bar { width: 100%; height: 8px; background: var(--border-color); border-radius: 4px; margin-bottom: 20px; display: flex; gap: 2px; overflow: hidden; }
.progress-segment { flex: 1; background: transparent; transition: background 0.3s; border-radius: 4px; }
.progress-segment.done { background: var(--primary-green); }
.progress-segment.current { background: var(--text-dim); animation: pulse-segment 1s infinite; }
@keyframes pulse-segment { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
.lesson-content { flex: 1; display: flex; flex-direction: column; width: 100%; justify-content: center; overflow-y: auto; padding-bottom: 10px; }
.prompt-text { text-align: center; font-size: 1rem; color: var(--text-dim); margin-bottom: 10px; }
.main-text { text-align: center; font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.main-text .emoji { font-size: 2rem; }
/* Inputs */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-btn { background: var(--card-dark); border: 2px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 12px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
.opt-btn:active { transform: scale(0.98); }
.opt-btn.selected { border-color: var(--secondary-blue); background: rgba(28, 176, 246, 0.2); color: var(--secondary-blue); }
.opt-btn.correct { border-color: var(--primary-green); background: rgba(88, 204, 2, 0.2); color: var(--primary-green); }
.opt-btn.wrong { border-color: var(--error-red); background: rgba(255, 75, 75, 0.2); color: var(--error-red); }
.sentence-area { min-height: 60px; border: 2px dashed var(--border-color); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: center; justify-content: center; margin-bottom: 15px; }
.token { background: #fff; color: #333; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; cursor: pointer; box-shadow: 0 2px 0 #aaa; transition: transform 0.1s; }
.token:active { transform: translateY(2px); box-shadow: 0 0 0 #aaa; }
.token.placed { opacity: 0.3; pointer-events: none; }
.token.in-sentence { background: #f0f0f0; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.match-card { background: var(--card-dark); border: 2px solid var(--border-color); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 600; min-height: 70px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 0.95rem; }

.audio-prompt-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1899D6; }

.speak-btn { width: 100%; min-height: 58px; background: var(--secondary-blue); color: white; border: none; border-bottom: 4px solid #1899D6; padding: 16px; font-size: 1.05rem; font-weight: 700; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; }

.listen-again-btn { background: var(--card-dark); border: 2px solid var(--border-color); color: var(--text-main); min-height: 46px; padding: 10px 18px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; touch-action: manipulation; }

.write-mode-btn { width: 100%; min-height: 56px; background: var(--card-dark); border: 2px solid var(--border-color); color: var(--text-main); border-radius: 14px; padding: 14px 18px; font-size: 1.02rem; font-weight: 700; cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; }
.write-mode-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.08); }
.text-input-fallback { width: 100%; min-height: 52px; background: var(--card-dark); border: 2px solid var(--border-color); border-radius: 12px; padding: 12px; color: var(--text-main); font-size: 16px; text-align: center; outline: none; }
/* Footer & Feedback */
.footer-bar { margin-top: auto; width: 100%; padding-top: 15px; flex-shrink: 0; }
.feedback-msg { min-height: 50px; border-radius: 10px; display: none; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 10px; padding: 10px; flex-direction: column; font-size: 0.95rem; }
.feedback-msg.show { display: flex; }
.feedback-msg.correct { background: rgba(88, 204, 2, 0.2); color: var(--primary-green); border: 2px solid var(--primary-green); }
.feedback-msg.wrong { background: rgba(255, 75, 75, 0.2); color: var(--error-red); border: 2px solid var(--error-red); }
.btn-main { width: 100%; padding: 14px; border: none; border-bottom: 4px solid #2A3E45; border-radius: 12px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; cursor: pointer; background: #3D545C; color: #AFAFAF; pointer-events: none; transition: all 0.1s; }
.btn-main.active { background: var(--primary-green); border-bottom-color: var(--primary-green-dark); color: white; pointer-events: all; }
.btn-main.retry { background: var(--error-red); border-bottom-color: #D43939; color: white; pointer-events: all; }
.btn-main.continue { background: var(--secondary-blue); border-bottom-color: #1899D6; color: white; pointer-events: all; }

.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); display: none; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; text-align: center; padding: 20px; }
.overlay.active { display: flex; }

const getRandom = (arr, n) => [...arr].sort(() => 0.5 - Math.random()).slice(0, n);
const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

const esTokens = (es) => es.replace(/[¿?¡!.,;:]/g, '').split(' ').filter(Boolean)
    .map((w, i) => i === 0 ? w.toLowerCase() : w);
const canTranslate = (i) => Array.isArray(i.gloss) && i.gloss.length === i.de.split(' ').length && esTokens(i.es).length >= 2;

function generateQuestion(type, categoryKey) {
const category = VOCAB[categoryKey];
if (!category) return null;
let pool = category;
if (type === 'translate') {
pool = category.filter(i => canTranslate(i));
if (!pool.length) return null;
}
const item = getRandomItem(pool);
let wrongOptions = category.filter(i => i.de !== item.de);
if (wrongOptions.length < 3) wrongOptions = Object.values(VOCAB).flat().filter(i => i.de !== item.de && i.es !== item.es);
const distractors = getRandom(wrongOptions, 3).map(i => i.es);
const options = [item.es, ...distractors].sort(() => 0.5 - Math.random());
switch(type) {
case 'choice':
return { type: 'choice', prompt: `¿Qué significa "${item.de}"?`, text: item.de, options: options, correct: item.es, emoji: item.emoji || '❓' };
case 'audio':
return { type: 'audio', prompt: 'Escucha y selecciona el significado', audioText: item.de, options: options, correct: item.es, emoji: '🔊' };
case 'match':
const matchItems = getRandom(category, 4);
return { type: 'match', prompt: 'Relaciona las parejas', pairs: matchItems.map(i => [i.de, i.es]) };
case 'speak':
return { type: 'speak', prompt: 'Di esto en alemán:', text: item.de, meaning: item.es, emoji: item.emoji || '🗣️' };
case 'translate': {
const ans = esTokens(item.es);
const ansLow = ans.map(w => w.toLowerCase());
let poolWords = [...new Set(
    Object.entries(VOCAB).filter(([k]) => k.startsWith('phrases'))
        .flatMap(([, items]) => items.flatMap(i => esTokens(i.es)))
        .filter(w => w === w.toLowerCase() && !ansLow.includes(w))
)];
if (poolWords.length < 3) {
    poolWords = [...new Set([
        ...poolWords,
        ...Object.values(VOCAB).flat().flatMap(i => esTokens(i.es)).filter(w => w === w.toLowerCase() && !ansLow.includes(w))
    ])];
}
const bank = [...ans, ...getRandom(poolWords, 3)].sort(() => 0.5 - Math.random());
return { type: 'translate', prompt: 'Traduce al español:', text: item.de, gloss: item.gloss, words: bank, correct: ans, answer: item.es };
}
case 'wordbank':
if (categoryKey.startsWith('phrases')) {
const ws = item.de.split(' ');
let shuffled = [...ws], tries = 0;
do { shuffled.sort(() => 0.5 - Math.random()); tries++; }
while (ws.length > 1 && shuffled.join(' ') === ws.join(' ') && tries < 10);
return { type: 'wordbank', prompt: 'Ordena la frase en alemán:', text: item.es, emoji: '🧩', words: shuffled, correct: ws, word: item.de };
}
const words = getRandom(category, 3);
return { type: 'wordbank', prompt: 'Ordena las palabras (concepto)', text: words.map(w => w.de).join(' + '), words: words.map(w => w.de).sort(() => 0.5 - Math.random()), correct: words.map(w => w.de) };
default:
return null;
}
}

// --- SOUND ENGINE ---
function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
initAudio();
if (audioCtx.state === 'suspended') audioCtx.resume();
const osc = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();
osc.connect(gainNode);
gainNode.connect(audioCtx.destination);
if (type === 'correct') {
osc.type = 'sine';
osc.frequency.setValueAtTime(600, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
osc.start();
osc.stop(audioCtx.currentTime + 0.2);
} else if (type === 'wrong') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
osc.start();
osc.stop(audioCtx.currentTime + 0.3);
} else if (type === 'win') {
osc.type = 'sine';
const now = audioCtx.currentTime;
osc.frequency.setValueAtTime(523.25, now);
osc.frequency.setValueAtTime(659.25, now + 0.1);
osc.frequency.setValueAtTime(783.99, now + 0.2);
gainNode.gain.setValueAtTime(0.1, now);
gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
osc.start();
osc.stop(now + 0.5);
}
}

const isUnlocked = (globalIndex === 0) || prevDone;

lessonsRow.appendChild(node);
globalIndex++;
});

DOM.mapContainer.appendChild(unitDiv);
});

const generatedQuestions = qTypes.map(qType => generateQuestion(qType, category)).filter(q => q);

// Speech & Typing Handlers
const DIGIT_DE = { '0':'null','1':'eins','2':'zwei','3':'drei','4':'vier','5':'fünf','6':'sechs','7':'sieben','8':'acht','9':'neun','10':'zehn','11':'elf','12':'zwölf','20':'zwanzig','100':'hundert' };
const normSpeechDE = (s, fold = false) => {
  let out = String(s || '').toLowerCase()
    .replace(/geht['’]s/g, 'geht es').replace(/wie['’]s/g, 'wie es')
    .replace(/[.,!?¿¡;:"'‘’`´\-()]/g, ' ').replace(/ß/g, 'ss').replace(/\s+/g, ' ').trim();
  if (fold) out = out.replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u');
  return out.split(' ').filter(Boolean).map(w => DIGIT_DE[w] || w).join(' ');
};
const isSpeechMatchDE = (said, target) => {
  const a = normSpeechDE(said, true), b = normSpeechDE(target, true);
  if (!a || !b) return false;
  if (a === b || normSpeechDE(said) === normSpeechDE(target)) return true;
  const tw = b.split(' '), sw = a.split(' ');
  const hits = tw.filter(w => sw.includes(w)).length;
  return tw.every(w => sw.includes(w)) || (tw.length >= 2 && hits / tw.length >= 0.8);
};

let voiceBusy = false, voiceTimers = [], activeVoiceRec = null, voiceListening = false;
const clearVoiceTimers = () => { voiceTimers.forEach(clearTimeout); voiceTimers = []; };

function startVoice(rec, o) {
  if (voiceBusy) {
    if (activeVoiceRec && voiceListening) { try { activeVoiceRec.stop(); } catch (e) {} }
    else if (activeVoiceRec) { try { activeVoiceRec.abort(); } catch (e) {} }
    return;
  }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!rec && !R) { if (o.status) o.status.innerText = 'Tu navegador no soporta voz. Usa el botón de escribir.'; return; }
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }

  // En iPhone es clave crear una instancia nueva en cada toque
  const r = R ? new R() : rec;
  r.lang = 'de-DE';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 5;

  voiceBusy = true;
  voiceListening = false;
  activeVoiceRec = r;
  clearVoiceTimers();

  let finished = false, started = false, waitingStarted = false, latestAlts = [];
  const spin = '<span class="mini-spin"></span>';
  const say = (html) => { if (o.status) o.status.innerHTML = html; };
  const done = () => {
    finished = true; voiceBusy = false; voiceListening = false; activeVoiceRec = null;
    clearVoiceTimers();
    if (o.btn) { o.btn.classList.remove('listening'); o.btn.innerText = o.idleText; }
  };
  const deliver = (alts) => {
    done(); say('');
    const target = o.target || '';
    const best = (target && alts.find(a => isSpeechMatchDE(a, target))) || alts[0] || '';
    o.onText(best);
  };
  const waiting = () => {
    if (finished || waitingStarted) return;
    waitingStarted = true; voiceListening = false;
    if (o.btn) { o.btn.classList.remove('listening'); o.btn.innerText = '⏳ Procesando...'; }
    say(spin + 'Procesando tu voz...');
    voiceTimers.push(setTimeout(() => { if (!finished) say(spin + 'Está tardando un poco, ten paciencia 🙏'); }, 3500));
    voiceTimers.push(setTimeout(() => {
      if (!finished) {
        try { r.abort(); } catch (e) {}
        if (latestAlts.length) deliver(latestAlts);
        else { done(); say('No he podido procesarlo. Inténtalo de nuevo o escribe abajo.'); }
      }
    }, 10000));
  };

  r.onstart = () => {
    if (finished) return;
    started = true; voiceListening = true;
    if (o.btn) { o.btn.classList.add('listening'); o.btn.innerText = '🔴 Escuchando... toca para terminar'; }
    say('');
    voiceTimers.push(setTimeout(() => {
      if (!finished && !waitingStarted) { try { r.stop(); } catch (e) {} waiting(); }
    }, 11000));
  };
  r.onspeechend = waiting;
  r.onaudioend = waiting;
  r.onresult = (e) => {
    if (finished) return;
    const alts = []; let isFinal = false;
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) isFinal = true;
      for (let k = 0; k < e.results[i].length; k++) {
        const t = (e.results[i][k].transcript || '').trim();
        if (t && !alts.includes(t)) alts.push(t);
      }
    }
    if (alts.length) latestAlts = alts;
    if (isFinal && alts.length) { try { r.stop(); } catch (e) {} deliver(alts); }
    else if (alts.length) say('🎙️ "' + alts[0] + '"');
  };
  r.onerror = (e) => {
    if (finished) return;
    if ((e.error === 'no-speech' || e.error === 'aborted') && latestAlts.length) { deliver(latestAlts); return; }
    done();
    const msgs = {
      'not-allowed': 'Permite el micrófono en Safari o pulsa el botón de escribir.',
      'service-not-allowed': 'Activa el Dictado en Ajustes de iPhone o pulsa escribir.',
      'no-speech': 'No te he oído. Acerca el móvil e inténtalo de nuevo.',
      'audio-capture': 'No se detecta micrófono. Cierra otras apps de audio.',
      'network': 'El dictado necesita conexión a internet.'
    };
    say(msgs[e.error] || 'Error con la voz. Inténtalo de nuevo o escribe.');
  };
  r.onend = () => {
    if (finished) return;
    if (latestAlts.length) deliver(latestAlts);
    else { done(); say('No he oído nada. Inténtalo de nuevo o escribe.'); }
  };

  voiceTimers.push(setTimeout(() => {
    if (!finished && !started) {
      try { r.abort(); } catch (e) {}
      done(); say('El micrófono tardó en activarse en iPhone. Prueba otra vez o escribe.');
    }
  }, 5500));

  if (o.btn) o.btn.innerText = '🎙️ Activando micrófono...';
  say(spin + 'Activando el micrófono...');
  try { r.start(); } catch (e) { done(); say('No se pudo iniciar el micrófono.'); }
}

   if (q.type === 'translate') cText = q.answer;

};
const saveMyPhrases = () => {
    try { localStorage.setItem('germango_myphrases', JSON.stringify(myPhrases)); } catch (e) {}
    syncMyPhrases();
};

const mineCardHtml = () => {
    const n = myPhrases.length;
    return `<div class="mine-card"><div class="mine-head"><span>⭐ Mis frases</span><span>${n}</span></div>
        <div class="mine-sub">${n >= 3 ? 'Practica las frases que has guardado.' : 'Traduce y guarda frases (mínimo 3) para practicarlas.'}</div>
        <div class="acct-actions"><button class="tool-btn" onclick="startMine()">▶ Practicar</button>
        <button class="tool-btn" onclick="openTranslator()">🌐 Traductor</button></div></div>`;
};
const startMine = () => {
    if (myPhrases.length < 3) {
        openTranslator();
        const m = document.getElementById('tr-msg');
        if (m) m.innerText = 'Añade al menos 3 frases para poder practicarlas.';
        return;
    }
    startLesson({ id: 'mine', category: 'phrases_mine', icon: '⭐' });
};

const openTranslator = () => {
    const c = document.getElementById('translator-container');
    if (!c) return;
    showScreen('screen-translator');
    c.innerHTML = `
        <div class="songs-head"><button class="back-btn" onclick="showScreen('screen-map')">←</button><h2>🌐 Traductor</h2></div>
        <div class="tr-label">Español</div>
        <textarea id="tr-es" class="text-input-fallback tr-area" rows="2" maxlength="${MAX_PHRASE_LEN}" placeholder="Escribe una frase en español..."></textarea>
        <button class="btn-main active" id="tr-btn" style="margin-top:10px" onclick="doTranslate()">TRADUCIR AL ALEMÁN</button>
        <div class="tr-alts" id="tr-alts"></div>
        <div class="tr-label">Alemán <button class="tool-btn" onclick="speakTr()">🔊 Escuchar</button></div>
        <input type="text" id="tr-de" class="text-input-fallback tr-input" maxlength="${MAX_PHRASE_LEN}" oninput="updateGlossHint()" placeholder="La traducción aparecerá aquí (puedes corregirla)" autocomplete="off" autocapitalize="off">
        <details class="tr-gloss"><summary>Opcional: significado palabra por palabra</summary>
            <input type="text" id="tr-gloss" class="text-input-fallback tr-input" placeholder="yo, me llamo, Anna" autocomplete="off">
            <div class="song-hint" id="tr-gloss-hint" style="margin-top:6px">Sirve para usar la frase en el ejercicio de traducir oraciones.</div>
        </details>
        <div class="auth-msg" id="tr-msg"></div>
        <button class="btn-main continue" onclick="addMyPhrase()">➕ AÑADIR A MIS FRASES</button>
        <div class="song-hint" style="margin-top:10px">⚠️ Las traducciones automáticas pueden tener errores: revisa la frase antes de añadirla. El texto se envía a un servicio externo (MyMemory) para traducirlo. También puedes escribir tú mismo la frase en alemán.</div>
        <h3 class="tr-h">Mis frases (<span id="tr-count">0</span>)</h3>
        <div id="tr-list"></div>`;
    renderMyList();
};

const speakTr = () => { const d = document.getElementById('tr-de'); if (d && d.value.trim()) speak(cleanPhrase(d.value)); };

const updateGlossHint = () => {
    const d = document.getElementById('tr-de'), h = document.getElementById('tr-gloss-hint');
    if (!d || !h) return;
    const n = cleanPhrase(d.value).split(' ').filter(Boolean).length;
    h.innerText = n
        ? `La frase alemana tiene ${n} palabra${n === 1 ? '' : 's'}: escribe ${n} significado${n === 1 ? '' : 's'} separados por comas (opcional).`
        : 'Sirve para usar la frase en el ejercicio de traducir oraciones.';
};

const doTranslate = async () => {
    const esEl = document.getElementById('tr-es'), msg = document.getElementById('tr-msg');
    const btn = document.getElementById('tr-btn'), alts = document.getElementById('tr-alts');
    const es = cleanPhrase(esEl && esEl.value);
    if (!es) { msg.innerText = 'Escribe primero una frase en español.'; return; }
    msg.innerText = ''; alts.innerHTML = ''; trAlts = [];
    btn.innerText = 'Traduciendo...';
    try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        let url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(es) + '&langpair=es%7Cde';
        if (MYMEMORY_EMAIL) url += '&de=' + encodeURIComponent(MYMEMORY_EMAIL);
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        const main = decodeEntities(String((data.responseData && data.responseData.translatedText) || ''));
        const status = Number(data.responseStatus);
        if (/MYMEMORY WARNING/i.test(main) || status === 429) {
            msg.innerText = 'Has llegado al límite diario del traductor. Inténtalo mañana o escribe tú la frase en alemán.';
            return;
        }
        if (status !== 200 || !main) { msg.innerText = 'No se pudo traducir. Inténtalo de nuevo.'; return; }
        const best = cleanPhrase(main);
        document.getElementById('tr-de').value = best;
        updateGlossHint();
        const seen = new Set([best.toLowerCase()]);
        (data.matches || []).slice().sort((a, b) => (Number(b.match) || 0) - (Number(a.match) || 0)).forEach(m => {
            const t = cleanPhrase(decodeEntities(String(m.translation || '')));
            if (t && !seen.has(t.toLowerCase()) && !/MYMEMORY WARNING/i.test(t) && trAlts.length < 3) { seen.add(t.toLowerCase()); trAlts.push(t); }
        });
        if (trAlts.length) {
            alts.innerHTML = '<div class="song-hint" style="width:100%">Otras opciones:</div>' +
                trAlts.map((t, i) => `<button class="tool-btn" onclick="useAlt(${i})">${esc(t)}</button>`).join('');
        }
        speak(best);
    } catch (e) {
        msg.innerText = 'No se pudo conectar con el traductor. Revisa tu conexión.';
    } finally {
        btn.innerText = 'TRADUCIR AL ALEMÁN';
    }
};
const useAlt = (i) => {
    const d = document.getElementById('tr-de');
    if (d && trAlts[i]) { d.value = trAlts[i]; updateGlossHint(); }
};

const addMyPhrase = () => {
    const msg = document.getElementById('tr-msg');
    const es = cleanPhrase(document.getElementById('tr-es').value);
    const de = cleanPhrase(document.getElementById('tr-de').value);
    if (!es || !de) { msg.innerText = 'Escribe la frase en español y en alemán.'; return; }
    if (myPhrases.length >= MAX_MY_PHRASES) { msg.innerText = `Has llegado al máximo de ${MAX_MY_PHRASES} frases.`; return; }
    if (myPhrases.some(p => p.de.toLowerCase() === de.toLowerCase())) { msg.innerText = 'Esa frase ya está en tu lista.'; return; }
    let gloss;
    const raw = (document.getElementById('tr-gloss').value || '').trim();
    if (raw) {
        const n = de.split(' ').length;
        const g = raw.split(',').map(cleanPhrase);
        if (g.length !== n || g.some(x => !x)) {
            msg.innerText = `La frase alemana tiene ${n} palabra${n === 1 ? '' : 's'}: escribe ${n} significado${n === 1 ? '' : 's'} separados por comas, o deja el campo vacío.`;
            return;
        }
        gloss = g;
    }
    myPhrases.push({ de, es, gloss });
    saveMyPhrases();
    document.getElementById('tr-es').value = '';
    document.getElementById('tr-de').value = '';
    document.getElementById('tr-gloss').value = '';
    document.getElementById('tr-alts').innerHTML = '';
    updateGlossHint();
    renderMyList();
    updateUI();
    msg.innerText = myPhrases.length >= 3 ? '✅ Añadida. Ya puedes practicar en ⭐ Mis frases.' : `✅ Añadida. Faltan ${3 - myPhrases.length} para poder practicar.`;
};
const removeMyPhrase = (i) => {
    if (!myPhrases[i]) return;
    if (typeof confirm === 'function' && !confirm('¿Borrar esta frase?')) return;
    myPhrases.splice(i, 1);
    saveMyPhrases();
    renderMyList();
    updateUI();
};
const renderMyList = () => {
    const l = document.getElementById('tr-list'), c = document.getElementById('tr-count');
    if (c) c.innerText = myPhrases.length;
    if (!l) return;
    l.innerHTML = myPhrases.length ? myPhrases.map((p, i) => `
        <div class="my-item"><div><div class="de">${esc(p.de)}${p.gloss ? ' 🔤' : ''}</div><div class="es">${esc(p.es)}</div></div>
        <div class="my-act"><button class="tool-btn" onclick="speak(myPhrases[${i}].de)">🔊</button>
        <button class="tool-btn" onclick="removeMyPhrase(${i})">🗑️</button></div></div>`).join('')
        : '<div class="song-empty">Aún no has guardado ninguna frase.</div>';
};

// INIT
loadLocal();
fetchCourseData();
loadMyPhrases();
</script>
<script>
// ===== EXTRAS: scroll a la lección actual, siguiente lección, tarjetas =====
/* Germango extras v2: scroll a la lección actual, botón "Siguiente lección",
   tarjetas ES -> DE dentro del mapa (nodo 🃏 de repaso por unidad) y como modo aparte (🃏 de la cabecera). */
(function () {
  const st = document.createElement('style');
  st.textContent = `
input{user-select:text;-webkit-user-select:text}
.fc-deck{position:relative;width:100%;height:150px;margin:10px 0 18px}
.fc-card{position:absolute;inset:0;background:var(--card-dark);border:2px solid var(--border-color);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .35s,opacity .35s}
.fc-l1{transform:translateY(8px) scale(.96);opacity:.7}
.fc-l2{transform:translateY(16px) scale(.92);opacity:.4}
.fc-top{z-index:3;font-size:1.6rem;font-weight:700}
.fc-ok{transform:translateX(120%) rotate(15deg);opacity:0;border-color:var(--primary-green)}
.fc-bad{animation:shake .3s;border-color:var(--error-red)}
.fc-mic{width:100%;margin-top:12px;padding:14px;min-height:50px;font-size:1.1rem;font-weight:700;color:var(--text-main);background:var(--card-dark);border:2px solid var(--border-color);border-radius:12px;cursor:pointer;touch-action:manipulation}
.fc-mic:active{background:rgba(255,255,255,.1)}
.card-node.ready{border-color:var(--bonus-gold);box-shadow:0 0 12px rgba(255,200,0,.35)}
.card-node.card-done{border-color:var(--primary-green);background:rgba(88,204,2,.1)}`;
  document.head.appendChild(st);

  /* 1) Al volver al mapa, centrar la lección actual */
  const goCurrent = () => requestAnimationFrame(() => {
    const n = document.querySelector('.lesson-node.current');
    if (n) n.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
  const mapEl = document.getElementById('screen-map');
  new MutationObserver(() => { if (mapEl.classList.contains('active')) goCurrent(); })
    .observe(mapEl, { attributes: true, attributeFilter: ['class'] });
  goCurrent();

  /* 2) Botón "Siguiente lección" en la pantalla de resultado */
  const res = document.getElementById('screen-result');
  const old = res.querySelector('button');
  old.textContent = 'VOLVER AL MAPA';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-main active';
  nextBtn.style.marginBottom = '10px';
  nextBtn.textContent = 'SIGUIENTE LECCIÓN';
  nextBtn.onclick = () => {
    const n = document.querySelector('.lesson-node.current');
    if (n && state.hearts > 0) n.click(); else exitToMap();
  };
  res.insertBefore(nextBtn, old);

  /* 3) Tarjetas */
  const LABELS = { greetings: 'Saludos', family: 'Familia', food: 'Comida', animals: 'Animales', numbers: 'Números', time: 'Tiempo', colors: 'Colores', verbs: 'Verbos', body: 'Cuerpo', house: 'Casa', weather: 'Clima', transport: 'Transporte', professions: 'Profesiones' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => s.toLowerCase().replace(/[.,!?¿¡]/g, '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/\s+/g, ' ').trim();

  const DONE_KEY = 'germango_cards_done';
  const getDone = () => { try { return JSON.parse(localStorage.getItem(DONE_KEY)) || []; } catch (e) { return []; } };
  const markDone = id => { try { const d = getDone(); if (!d.includes(id)) { d.push(id); localStorage.setItem(DONE_KEY, JSON.stringify(d)); } } catch (e) {} };

  const scr = document.createElement('div');
  scr.id = 'screen-cards';
  scr.className = 'screen';
  document.getElementById('app').appendChild(scr);

  let deck = [], checked = false, lastOk = false;

  /* Modo aparte: elegir tema */
  function picker() {
    showScreen('screen-cards');
    scr.innerHTML = '<h2 style="text-align:center;margin-bottom:6px">🃏 Tarjetas</h2><p style="text-align:center;color:var(--text-dim);margin-bottom:15px">Elige un tema</p><div class="options-grid">' +
      Object.keys(VOCAB).map(k => `<button class="opt-btn" data-k="${k}">${LABELS[k] || k}</button>`).join('') + '</div>';
    scr.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => start({ pool: VOCAB[b.dataset.k] }); });
  }

  /* En el mapa: nodo de repaso al final de cada unidad (se abre al completar sus 3 lecciones) */
  const poolOf = unit => {
    const seen = new Set(), out = [];
    unit.lessons.forEach(l => { if (!seen.has(l.category)) { seen.add(l.category); out.push(...VOCAB[l.category]); } });
    return out;
  };
  function addCardNodes() {
    document.querySelectorAll('#map-container .unit-container').forEach((uc, i) => {
      const unit = DB.units[i], row = uc.querySelector('.lessons-row');
      if (!unit || !row || row.querySelector('.card-node')) return;
      const unlocked = unit.lessons.every(l => state.completed.includes(l.id));
      const done = getDone().includes(unit.id);
      const n = document.createElement('div');
      n.className = 'lesson-node card-node ' + (!unlocked ? 'locked' : done ? 'card-done' : 'ready');
      n.innerHTML = unlocked ? '<span class="icon">🃏</span><span class="lvl">Repaso</span>' : '<span class="icon">🔒</span>';
      if (unlocked) n.onclick = () => start({ pool: poolOf(unit), unitId: unit.id });
      row.appendChild(n);
    });
  }
  new MutationObserver(addCardNodes).observe(document.getElementById('map-container'), { childList: true });
  addCardNodes();

  function start(src) {
    deck = [...src.pool].sort(() => Math.random() - 0.5).slice(0, 8).map(i => ({ es: i.es, de: i.de, emoji: i.emoji || '' }));
    showScreen('screen-cards');
    render(src);
  }

  function render(src) {
    if (!deck.length) return finish(src);
    const t = deck[0];
    checked = false;
    scr.innerHTML = `<div style="text-align:center;color:var(--text-dim);margin-bottom:10px">Tarjetas restantes: ${deck.length}</div>
<div class="fc-deck">${deck.length > 2 ? '<div class="fc-card fc-l2"></div>' : ''}${deck.length > 1 ? '<div class="fc-card fc-l1"></div>' : ''}<div class="fc-card fc-top" id="fc-top"><span style="font-size:2.2rem">${esc(t.emoji)}</span><span>${esc(t.es)}</span></div></div>
<input id="fc-in" class="text-input-fallback" style="margin-bottom:10px" placeholder="En alemán..." autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="feedback-msg" id="fc-fb"></div>
<button class="btn-main" id="fc-btn">COMPROBAR</button>
<button class="fc-mic" id="fc-mic">🎤 Decirlo en voz alta</button>
<div class="mic-feedback" id="fc-mic-status"></div>`;
    const inp = document.getElementById('fc-in'), btn = document.getElementById('fc-btn'), fb = document.getElementById('fc-fb');
    inp.oninput = () => { if (!checked) btn.classList.toggle('active', !!inp.value.trim()); };
    inp.onkeydown = e => { if (e.key === 'Enter') btn.onclick(); };
    btn.onclick = () => {
      if (checked) { const d = deck.shift(); if (!lastOk) deck.push(d); render(src); return; }
      const v = inp.value.trim();
      if (!v) return;
      const a = norm(v), c = norm(t.de);
      lastOk = a === c || a === c.replace(/^(der|die|das) /, '');
      checked = true;
      document.getElementById('fc-top').classList.add(lastOk ? 'fc-ok' : 'fc-bad');
      fb.className = 'feedback-msg show ' + (lastOk ? 'correct' : 'wrong');
      fb.innerHTML = `<span>${lastOk ? '¡Excelente!' : 'Incorrecto'}</span><span style="font-size:.8rem;opacity:.8">${esc(t.de)}</span>`;
      playSound(lastOk ? 'correct' : 'wrong');
      if (lastOk) speak(t.de);
      btn.textContent = 'CONTINUAR';
      btn.className = 'btn-main ' + (lastOk ? 'continue' : 'retry');
    };
    document.getElementById('fc-mic').onclick = () => {
      const R = window.webkitSpeechRecognition || window.SpeechRecognition;
      if (!R) { alert('Tu navegador no soporta reconocimiento de voz.'); return; }
      const r = new R(); r.lang = 'de-DE';
      startVoice(r, { btn: document.getElementById('fc-mic'), status: document.getElementById('fc-mic-status'), idleText: '🎤 Decirlo en voz alta', onText: (t) => { inp.value = t; inp.oninput(); } });
    };
    inp.focus();
  }

  function finish(src) {
    const first = src.unitId && !getDone().includes(src.unitId);
    const gems = first ? 15 : 5;
    if (src.unitId) markDone(src.unitId);
    state.gems += gems; save(); updateUI(); playSound('win');
    scr.innerHTML = `<div style="text-align:center;font-size:4rem;margin-top:30px">🎉</div>
<h2 style="text-align:center;margin:10px 0">¡Tarjetas completadas!</h2>
<p style="text-align:center;color:var(--text-dim);margin-bottom:20px">+${gems} 💎</p>
<button class="btn-main active" id="fc-again">OTRO MAZO</button>
<button class="btn-main active" style="margin-top:10px" id="fc-map">VOLVER AL MAPA</button>`;
    document.getElementById('fc-again').onclick = () => start(src);
    document.getElementById('fc-map').onclick = () => showScreen('screen-map');
  }

  /* Botón 🃏 en la cabecera: modo aparte */
  document.querySelector('.stats').insertAdjacentHTML('afterbegin', '<div class="stat-box" id="open-cards" title="Tarjetas">🃏</div>');
  document.getElementById('open-cards').onclick = picker;
})();
</script>
</body>
