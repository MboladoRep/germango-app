name: Aplicar cambios
on: workflow_dispatch
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
            - name: Modificar index.html
        run: |
          set +e
          python3 aplicar_cambios.py > salida.txt 2>&1
          code=$?
          cat salida.txt
          if [ $code -ne 0 ]; then echo "::error::$(tr '\n' ' ' < salida.txt | cut -c1-900)"; exit 1; fi
          rm -f salida.txt
