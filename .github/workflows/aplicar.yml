name: Aplicar cambios
on: workflow_dispatch
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modificar index.html
        run: python3 aplicar_cambios.py
      - name: Subir cambios
        run: |
          rm -f index.html.bak aplicar_cambios.py
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Scroll a la lección actual y tarjetas ES-DE"
          git push
